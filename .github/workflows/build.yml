name: Build Next Game EXE
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --legacy-peer-deps
      - run: npm install --save-dev electron electron-builder --legacy-peer-deps
      - run: npm run build
        env:
          DATABASE_URL: "postgresql://user:pass@localhost:5432/mydb"
      - shell: pwsh
        run: |
          @{
            appId = "com.next.game"
            productName = "NextGame"
            asar = $false
            directories = @{ output = "release" }
            files = @(
              @{ from = ".next"; to = ".next"; filter = @("**/*") },
              "public/**/*",
              "node_modules/**/*",
              "package.json",
              "main.js"
            )
            extraMetadata = @{ main = "main.js"; version = "1.0.0" }
            win = @{ target = "dir" }
          } | ConvertTo-Json -Depth 10 | Set-Content eb.json
          npx electron-builder --win --publish never --config eb.json
      - uses: actions/upload-artifact@v4
        with:
          name: Game-Ready
          path: release/win-unpacked/**/*
